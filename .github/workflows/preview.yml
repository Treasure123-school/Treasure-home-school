name: Vercel Preview Deployment

on:
  push:
    branches-ignore:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          npm_config_registry: https://registry.npmjs.org/

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- vercel-preview -->'
        continue-on-error: true

      - name: Post preview URL as PR comment
        uses: peter-evans/create-or-update-comment@v4
        if: github.event.pull_request.number != ''
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- vercel-preview -->
            ## 🔍 Vercel Preview Deployment

            | | |
            |---|---|
            | **Preview URL** | ${{ steps.deploy.outputs.preview_url }} |
            | **Branch** | `${{ github.ref_name }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Status** | ✅ Ready |

            > Preview updates automatically on every push to this branch.

      - name: Print preview URL to log
        run: |
          echo ""
          echo "============================================"
          echo "  VERCEL PREVIEW URL"
          echo "  ${{ steps.deploy.outputs.preview_url }}"
          echo "============================================"
          echo ""
